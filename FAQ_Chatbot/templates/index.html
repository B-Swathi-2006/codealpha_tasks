
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart FAQ Chatbot</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="chat-container">
        <header>
            <div class="bot-icon">AI</div>
            <div>
                <h1>Smart FAQ Chatbot</h1>
                <p>Ask me about Python, AI, ML or NLP</p>
            </div>
        </header>
        <div class="chat-actions">
            <span>Conversation History</span>
            <button type="button" id="clear-chat">Clear Chat 🗑️</button>
        </div>

        <section id="chat-box" class="chat-box"
                 aria-live="polite">
            <div class="message bot-message">
                Hello! 👋 I'm your FAQ assistant.
                What would you like to know?
            </div>
        </section>
        <div class="suggestions">
    <p>💡 Try asking:</p>

    <button type="button" class="suggestion">What is Python?</button>

    <button type="button" class="suggestion">What is AI?</button>

    <button type="button" class="suggestion">What is Machine Learning?</button>

    <button type="button" class="suggestion">What is DBMS?</button>

    <button type="button" class="suggestion">What is Flask?</button>
</div>

        <form id="chat-form">
            <input
                type="text"
                id="question"
                placeholder="Type your question..."
                autocomplete="off"
                aria-label="Your question"
                required
            >
            <button type="submit" id="send-button">Send</button>
        </form>

        <p class="footer">Powered by Python, Flask and NLP</p>
    </main>

    <script>
       
const form = document.getElementById("chat-form");
const input = document.getElementById("question");
const chatBox = document.getElementById("chat-box");
const sendButton = document.getElementById("send-button");
const clearButton = document.getElementById("clear-chat");

const welcomeMessage =
    "Hello! 👋 I'm your FAQ assistant. What would you like to know?";

// Save conversation history
function saveHistory() {
    const messages = [];

    chatBox.querySelectorAll(".message").forEach(message => {
        messages.push({
            text: message.textContent,
            type: message.classList.contains("user-message")
                ? "user-message"
                : "bot-message"
        });
    });

    localStorage.setItem("faqChatHistory", JSON.stringify(messages));
}

// Display a message
function addMessage(text, className, save = true) {
    const message = document.createElement("div");

    message.className = "message " + className;
    message.textContent = text;

    chatBox.appendChild(message);
    chatBox.scrollTop = chatBox.scrollHeight;

    if (save) {
        saveHistory();
    }
}
// Show typing animation
function showTyping() {
    const typing = document.createElement("div");

    typing.className = "message bot-message typing";
    typing.id = "typing-indicator";

    typing.innerHTML = `
        AI is typing
        <span class="dot">.</span>
        <span class="dot">.</span>
        <span class="dot">.</span>
    `;

    chatBox.appendChild(typing);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// Remove typing animation
function removeTyping() {
    const typing = document.getElementById("typing-indicator");

    if (typing) {
        typing.remove();
    }
}

// Load previous conversation
function loadHistory() {
    const savedMessages = localStorage.getItem("faqChatHistory");

    if (savedMessages) {
        try {
            const messages = JSON.parse(savedMessages);

            if (Array.isArray(messages)) {
                chatBox.innerHTML = "";

                messages.forEach(message => {
                    if (
                        typeof message.text === "string" &&
                        ["user-message", "bot-message"].includes(message.type)
                    ) {
                        addMessage(message.text, message.type, false);
                    }
                });

                if (messages.length > 0) return;
            }
        } catch (error) {
            console.log("Could not load chat history.");
        }
    }

    chatBox.innerHTML = "";
    addMessage(welcomeMessage, "bot-message", false);
}

loadHistory();

// Send a question
form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const question = input.value.trim();

    if (!question) return;

    addMessage(question, "user-message");
    showTyping();

    input.value = "";
    sendButton.disabled = true;

    try {
        const response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ question: question })
        });

        const data = await response.json();
        removeTyping();

        if (!response.ok) {
            throw new Error(data.answer || "Request failed.");
        }

        addMessage(data.answer, "bot-message");

    } catch (error) {
        removeTyping();
        addMessage(
            "Sorry, something went wrong. Please try again.",
            "bot-message"
        );
    } finally {
        sendButton.disabled = false;
        input.focus();
    }
});

// Suggested question buttons
document.querySelectorAll(".suggestion").forEach(button => {
    button.addEventListener("click", function() {
        input.value = this.textContent.trim();
        form.requestSubmit();
    });
});

// Clear conversation
clearButton.addEventListener("click", function() {
    localStorage.removeItem("faqChatHistory");

    chatBox.innerHTML = "";

    addMessage(welcomeMessage, "bot-message", false);
});

    </script>
</body>
</html>
